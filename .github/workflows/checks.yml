name: Test website
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    # Keep the browser-test OS supported by the pinned Playwright version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
