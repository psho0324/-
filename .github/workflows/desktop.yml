name: Build Windows planner
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
    tags: ['v*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  renderer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:renderer
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked Windows dependencies
        run: npm ci --no-audit --no-fund
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package version v$version" }
      - name: Run original tests and updater safety tests
        run: npm test
      - name: Launch actual Electron and verify desktop saving
        run: npm run test:desktop
      - name: Build Windows NSIS installer
        run: npm run dist:win
      - name: Verify packaged files
        run: npm run test:package
      - name: Install silently and launch installed application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'my-planner-installed'
          $installer = Start-Process -FilePath (Resolve-Path dist/MyPlanner-Setup.exe) -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS installation failed: $($installer.ExitCode)" }
          $env:PLANNER_EXECUTABLE = Join-Path $installDir 'MyPlanner.exe'
          $env:PLANNER_SMOKE_LABEL = 'installed'
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real installed update and data preservation
        shell: pwsh
        run: |
          $base = (Get-Content package.json | ConvertFrom-Json).version
          $next = node -p "require('semver').inc(require('./package.json').version,'patch')"
          $originalPackage = [IO.File]::ReadAllBytes((Resolve-Path package.json))
          $originalLock = [IO.File]::ReadAllBytes((Resolve-Path package-lock.json))
          $baseDist = Join-Path $env:RUNNER_TEMP 'planner-release-dist'
          $feedDir = Join-Path $env:RUNNER_TEMP 'planner-next-version-feed'
          Copy-Item dist $baseDist -Recurse
          New-Item -ItemType Directory $feedDir | Out-Null
          try {
            npm version $next --no-git-tag-version --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare test version' }
            npm run dist:win
            if ($LASTEXITCODE -ne 0) { throw 'Could not build next-version test installer' }
            Copy-Item dist/MyPlanner-Setup.exe,dist/latest.yml $feedDir
            if (Test-Path dist/MyPlanner-Setup.exe.blockmap) { Copy-Item dist/MyPlanner-Setup.exe.blockmap $feedDir }
            $env:PLANNER_EXECUTABLE = Join-Path $env:RUNNER_TEMP 'my-planner-installed/MyPlanner.exe'
            $env:PLANNER_UPDATE_FEED_DIR = $feedDir
            $env:PLANNER_BASE_DIST = $baseDist
            $env:PLANNER_BASE_VERSION = $base
            $env:PLANNER_EXPECTED_NEXT_VERSION = $next
            node tools/update-e2e.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Installed update/data preservation test failed' }
          } finally {
            [IO.File]::WriteAllBytes((Join-Path $PWD 'package.json'), $originalPackage)
            [IO.File]::WriteAllBytes((Join-Path $PWD 'package-lock.json'), $originalLock)
            Remove-Item dist -Recurse -Force
            Copy-Item $baseDist dist -Recurse
          }
          npm run test:package
          if ($LASTEXITCODE -ne 0) { throw 'Restored release files do not match original version' }
      - name: Create installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/MyPlanner-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MyPlanner-Setup.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload Windows build and verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-planner-windows
          if-no-files-found: warn
          path: |
            desktop/dist/MyPlanner-Setup.exe
            desktop/dist/SHA256SUMS.txt
            desktop/dist/latest.yml
            desktop/dist/MyPlanner-Setup.exe.blockmap
            desktop/test-results/**
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, renderer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: my-planner-windows
          path: desktop-artifacts
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          assets=(desktop-artifacts/dist/MyPlanner-Setup.exe desktop-artifacts/dist/SHA256SUMS.txt desktop-artifacts/dist/latest.yml desktop-artifacts/test-results/installed.json desktop-artifacts/test-results/update-e2e.json)
          if [ -f desktop-artifacts/dist/MyPlanner-Setup.exe.blockmap ]; then
            assets+=(desktop-artifacts/dist/MyPlanner-Setup.exe.blockmap)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --latest \
            --title "내 플래너 $GITHUB_REF_NAME — Windows 테스트 버전" \
            --notes-file desktop/RELEASE_NOTES.md
