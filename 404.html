<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>떠돌이의 작업실 — 페이지 찾기</title>
  <body>
    <p>
      페이지를 찾고 있습니다.
      <a href="https://psho0324.github.io/-/" id="home">작업실로 돌아가기</a>
    </p>
    <script>
      const root = 'https://psho0324.github.io/-/';
      document.querySelector('#home').href = root;
      const match = location.pathname.match(/\/projects\/([a-z0-9-]+)\/?$/);
      if (match) location.replace(root + '?project=' + encodeURIComponent(match[1]));
      else document.querySelector('p').firstChild.textContent = '이 페이지를 찾을 수 없습니다. ';
    </script>
  </body>
</html>
